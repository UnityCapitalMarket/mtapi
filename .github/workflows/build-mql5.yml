name: Build MQL5

on:
  pull_request:
    paths:
      - "mq5/**"
      - ".github/workflows/build-mql5.yml"
  workflow_dispatch:

jobs:
  build-mql5:
    name: Compile MtApi5.mq5
    runs-on: windows-2022
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      SOURCE_FILE: mq5/MtApi5.mq5
      OUTPUT_FILE: mq5/MtApi5.ex5

    steps:
      # --------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------------
      - name: Initialize build environment paths
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "MetaTrader5"
          $installerPath = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $compileLog = Join-Path $env:RUNNER_TEMP "metaeditor-compile.log"

          "MT5_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MT5_INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMPILE_LOG=$compileLog" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --------------------------------------------------------------------
      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"

          $urls = @(
            "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe",
            "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          )

          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Attempting download from: $url"
              Invoke-WebRequest -Uri $url -OutFile "${env:MT5_INSTALLER_PATH}"
              if ((Test-Path "${env:MT5_INSTALLER_PATH}") -and ((Get-Item "${env:MT5_INSTALLER_PATH}").Length -gt 0)) {
                $downloaded = $true
                break
              }
            } catch {
              Write-Warning "Download failed from $url : $($_.Exception.Message)"
            }
          }

          if (-not $downloaded) {
            throw "Failed to download MetaTrader 5 installer from all known URLs."
          }

      # --------------------------------------------------------------------
      - name: Install MetaTrader 5 silently
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:MT5_INSTALLER_PATH}")) {
            throw "Installer not found: ${env:MT5_INSTALLER_PATH}"
          }

          $installerInfo = Get-Item "${env:MT5_INSTALLER_PATH}"
          Write-Host "Installer: $($installerInfo.FullName)"
          Write-Host "Installer size: $($installerInfo.Length) bytes"

          New-Item -ItemType Directory -Path "${env:MT5_INSTALL_DIR}" -Force | Out-Null

          $attempts = @(
            @("/auto", "/path:`"${env:MT5_INSTALL_DIR}`""),
            @("/auto", "/portable", "/path:`"${env:MT5_INSTALL_DIR}`"")
          )

          $metaEditor = $null
          $exitCodes = @()

          foreach ($attempt in $attempts) {
            Write-Host "Running installer with args: $($attempt -join ' ')"
            $proc = Start-Process -FilePath "${env:MT5_INSTALLER_PATH}" -ArgumentList $attempt -Wait -PassThru
            $exitCodes += $proc.ExitCode
            Write-Host "Installer exited with code: $($proc.ExitCode)"

            $candidatePaths = @(
              (Join-Path "${env:MT5_INSTALL_DIR}" "metaeditor64.exe"),
              (Join-Path "${env:MT5_INSTALL_DIR}" "MetaEditor64.exe")
            )
            $metaEditor = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($metaEditor) {
              break
            }
          }

          if (-not $metaEditor) {
            Write-Warning "MetaTrader installation did not produce metaeditor64.exe under ${env:MT5_INSTALL_DIR}."
            $dir = "${env:MT5_INSTALL_DIR}"
            if (Test-Path $dir) {
              Write-Host "Install dir content snapshot:"
              Get-ChildItem -Path $dir -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 50 -ExpandProperty FullName |
                ForEach-Object { Write-Host $_ }
            }
            throw "MetaTrader 5 installation failed. Exit codes: $($exitCodes -join ', ')"
          }

      # --------------------------------------------------------------------
      - name: Resolve metaeditor64.exe path
        id: metaeditor
        shell: pwsh
        run: |
          $preferred = Join-Path "${env:MT5_INSTALL_DIR}" "metaeditor64.exe"
          if (Test-Path $preferred) {
            $metaEditor = $preferred
          } else {
            $roots = @(
              "${env:MT5_INSTALL_DIR}",
              "C:\Program Files",
              "C:\Program Files (x86)",
              "$env:APPDATA\MetaQuotes\Terminal",
              "$env:LOCALAPPDATA\MetaQuotes\Terminal",
              "$env:LOCALAPPDATA\Programs"
            )
            $metaEditor = Get-ChildItem -Path $roots -Filter "metaeditor64.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $metaEditor) {
            throw "metaeditor64.exe not found after installation."
          }

          "path=$metaEditor" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using MetaEditor: $metaEditor"

      # --------------------------------------------------------------------
      - name: Stage vendored include tree
        id: stage_includes
        shell: pwsh
        run: |
          $repoMq5 = Join-Path $env:GITHUB_WORKSPACE "mq5"
          $vendorInclude = Join-Path $repoMq5 "Include"
          $stageRoot = Join-Path $env:RUNNER_TEMP "mql5-stage"
          $stageInclude = Join-Path $stageRoot "Include"

          if (-not (Test-Path $vendorInclude)) {
            throw "Vendored include directory is missing: $vendorInclude"
          }

          Remove-Item -Path $stageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageInclude -Force | Out-Null
          Copy-Item -Path (Join-Path $vendorInclude "*") -Destination $stageInclude -Recurse -Force

          $requiredHeaders = @(
            "json.mqh",
            "hash.mqh",
            "CHistoryPositionInfo.mqh",
            "Trade\SymbolInfo.mqh",
            "Trade\OrderInfo.mqh",
            "Trade\Trade.mqh",
            "generic\hashmap.mqh"
          )

          foreach ($header in $requiredHeaders) {
            $headerPath = Join-Path $stageInclude $header
            if (-not (Test-Path $headerPath)) {
              throw "Missing vendored header in mq5/Include: $header"
            }
          }

          "root=$stageRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using staged include root: $stageRoot"

      # --------------------------------------------------------------------
      - name: Compile mq5/MtApi5.mq5 to MtApi5.ex5
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "${env:SOURCE_FILE}"
          $output = Join-Path $env:GITHUB_WORKSPACE "${env:OUTPUT_FILE}"
          $includeRoot = "${{ steps.stage_includes.outputs.root }}"
          $log = "${env:COMPILE_LOG}"
          $metaEditor = "${{ steps.metaeditor.outputs.path }}"

          if (-not (Test-Path $source)) {
            throw "Source file not found: $source"
          }
          if (-not (Test-Path $metaEditor)) {
            throw "MetaEditor not found: $metaEditor"
          }
          if (-not $includeRoot) {
            throw "Staged include root output is empty."
          }
          if (-not (Test-Path $includeRoot)) {
            throw "Staged include root not found: $includeRoot"
          }

          $compileArgs = @(
            "/compile:`"$source`"",
            "/include:`"$includeRoot`"",
            "/log:`"$log`"",
            "/s"
          )

          $proc = Start-Process -FilePath $metaEditor -ArgumentList $compileArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw "MetaEditor exited with non-zero code: $($proc.ExitCode)"
          }

          if (-not (Test-Path $output)) {
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw "Expected output file not found: $output"
          }

          if ((Get-Item $output).Length -le 0) {
            throw "Output file exists but is empty: $output"
          }

          if (Test-Path $log) {
            $logText = Get-Content $log -Raw
            if (
              $logText -match "(?im)\b([1-9]\d*)\s+errors?\b" -or
              $logText -match "(?im):\s*error\s+\d+\b"
            ) {
              Write-Host $logText
              throw "Compilation failed: compiler reported errors."
            }
          }

      # --------------------------------------------------------------------
      - name: Upload MtApi5.ex5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MtApi5-ex5
          path: mq5/MtApi5.ex5
          if-no-files-found: error

      # --------------------------------------------------------------------
      - name: Upload compile log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql5-compile-log
          path: ${{ runner.temp }}\metaeditor-compile.log
          if-no-files-found: ignore
