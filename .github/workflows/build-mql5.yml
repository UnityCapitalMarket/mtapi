name: Build MQL5

on:
  pull_request:
    paths:
      - "mq5/**"
      - ".github/workflows/build-mql5.yml"
  workflow_dispatch:

jobs:
  build-mql5:
    name: Compile MtApi5.mq5
    runs-on: windows-2022
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      SOURCE_FILE: mq5/MtApi5.mq5
      OUTPUT_FILE: mq5/MtApi5.ex5
      PORTABLE_DIR: metaeditor5_portable

    steps:
      # Checkout repository sources used for staging MQL5 compile inputs.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialize all paths used by the portable MetaEditor workflow.
      - name: Initialize portable build paths
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:GITHUB_WORKSPACE "${env:PORTABLE_DIR}"
          $portableMql5 = Join-Path $portableRoot "MQL5"
          $portableExperts = Join-Path $portableMql5 "Experts"
          $portableInclude = Join-Path $portableMql5 "Include"
          $installerPath = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $compileLog = Join-Path $env:RUNNER_TEMP "metaeditor-compile.log"

          "PORTABLE_ROOT=$portableRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_MQL5_DIR=$portableMql5" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_EXPERTS_DIR=$portableExperts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_INCLUDE_DIR=$portableInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MT5_INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMPILE_LOG=$compileLog" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Download the MetaTrader 5 installer, then use it only in /portable mode.
      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $urls = @(
            "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe",
            "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          )

          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Attempting download from: $url"
              Invoke-WebRequest -Uri $url -OutFile "${env:MT5_INSTALLER_PATH}"
              if ((Test-Path "${env:MT5_INSTALLER_PATH}") -and ((Get-Item "${env:MT5_INSTALLER_PATH}").Length -gt 0)) {
                $downloaded = $true
                break
              }
            } catch {
              Write-Warning "Download failed from $url : $($_.Exception.Message)"
            }
          }

          if (-not $downloaded) {
            throw "Failed to download MetaTrader 5 installer from all known URLs."
          }

      # Install MetaEditor into a workspace-local portable folder (no system dependency).
      - name: Install MetaEditor 5 in portable mode
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:MT5_INSTALLER_PATH}")) {
            throw "Installer not found: ${env:MT5_INSTALLER_PATH}"
          }

          Remove-Item -Path "${env:PORTABLE_ROOT}" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "${env:PORTABLE_ROOT}" -Force | Out-Null

          $installArgs = @(
            "/auto",
            "/portable",
            "/path:`"${env:PORTABLE_ROOT}`""
          )

          $proc = Start-Process -FilePath "${env:MT5_INSTALLER_PATH}" -ArgumentList $installArgs -Wait -PassThru
          Write-Host "Portable installer exit code: $($proc.ExitCode)"

          $metaEditor = @(
            (Join-Path "${env:PORTABLE_ROOT}" "metaeditor64.exe"),
            (Join-Path "${env:PORTABLE_ROOT}" "MetaEditor64.exe"),
            (Join-Path "${env:PORTABLE_ROOT}" "metaeditor.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $metaEditor) {
            $metaEditor = Get-ChildItem -Path "${env:PORTABLE_ROOT}" -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @("metaeditor64.exe", "MetaEditor64.exe", "metaeditor.exe") } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $metaEditor) {
            throw "Portable MetaEditor executable was not found under ${env:PORTABLE_ROOT}."
          }

          $portableMetaEditorExe = Join-Path "${env:PORTABLE_ROOT}" "metaeditor.exe"
          if ($metaEditor -ne $portableMetaEditorExe) {
            Copy-Item -Path $metaEditor -Destination $portableMetaEditorExe -Force
            $metaEditor = $portableMetaEditorExe
          }

          "METAEDITOR_EXE=$metaEditor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using portable MetaEditor executable: $metaEditor"

      # Copy only required project sources into the portable MQL5 tree.
      - name: Stage mq5 sources into portable MQL5 folder
        shell: pwsh
        run: |
          $repoSource = Join-Path $env:GITHUB_WORKSPACE "${env:SOURCE_FILE}"
          $repoInclude = Join-Path $env:GITHUB_WORKSPACE "mq5\Include"

          if (-not (Test-Path $repoSource)) {
            throw "Source file not found: $repoSource"
          }
          if (-not (Test-Path $repoInclude)) {
            throw "Include directory not found: $repoInclude"
          }

          New-Item -ItemType Directory -Path "${env:PORTABLE_EXPERTS_DIR}" -Force | Out-Null
          New-Item -ItemType Directory -Path "${env:PORTABLE_INCLUDE_DIR}" -Force | Out-Null

          Remove-Item -Path (Join-Path "${env:PORTABLE_EXPERTS_DIR}" "MtApi5.mq5") -Force -ErrorAction SilentlyContinue
          Remove-Item -Path (Join-Path "${env:PORTABLE_EXPERTS_DIR}" "MtApi5.ex5") -Force -ErrorAction SilentlyContinue
          Remove-Item -Path (Join-Path "${env:PORTABLE_INCLUDE_DIR}" "*") -Recurse -Force -ErrorAction SilentlyContinue

          Copy-Item -Path $repoSource -Destination (Join-Path "${env:PORTABLE_EXPERTS_DIR}" "MtApi5.mq5") -Force
          Copy-Item -Path (Join-Path $repoInclude "*") -Destination "${env:PORTABLE_INCLUDE_DIR}" -Recurse -Force

      # Compile from the portable MetaEditor binary and publish output back to the repo path.
      - name: Compile mq5/MtApi5.mq5 with portable MetaEditor
        shell: pwsh
        run: |
          $metaEditor = "${env:METAEDITOR_EXE}"
          $source = Join-Path "${env:PORTABLE_EXPERTS_DIR}" "MtApi5.mq5"
          $stagedEx5 = Join-Path "${env:PORTABLE_EXPERTS_DIR}" "MtApi5.ex5"
          $repoOutput = Join-Path $env:GITHUB_WORKSPACE "${env:OUTPUT_FILE}"
          $log = "${env:COMPILE_LOG}"

          if (-not (Test-Path $metaEditor)) {
            throw "Portable MetaEditor not found: $metaEditor"
          }
          if (-not (Test-Path $source)) {
            throw "Staged source file not found: $source"
          }

          Remove-Item -Path $repoOutput -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $stagedEx5 -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $log -Force -ErrorAction SilentlyContinue

          $compileArgs = @(
            "/compile:`"$source`"",
            "/log:`"$log`""
          )

          $proc = Start-Process -FilePath $metaEditor -ArgumentList $compileArgs -Wait -PassThru

          $logText = ""
          $hasCompilerErrors = $false
          if (Test-Path $log) {
            $logText = Get-Content $log -Raw
            if (
              $logText -match "(?im)\b([1-9]\d*)\s+errors?\b" -or
              $logText -match "(?im):\s*error\s+\d+\b"
            ) {
              $hasCompilerErrors = $true
            }
          }

          if ($hasCompilerErrors) {
            Write-Host $logText
            throw "Compilation failed: compiler reported errors."
          }

          if ($proc.ExitCode -ne 0 -and -not (Test-Path $log)) {
            throw "MetaEditor exited with non-zero code: $($proc.ExitCode), and no compile log was generated."
          }

          if (-not (Test-Path $stagedEx5)) {
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw "Expected compiled output was not generated: $stagedEx5"
          }

          New-Item -ItemType Directory -Path (Split-Path -Path $repoOutput -Parent) -Force | Out-Null
          Copy-Item -Path $stagedEx5 -Destination $repoOutput -Force

          if ((Get-Item $repoOutput).Length -le 0) {
            throw "Compiled output exists but is empty: $repoOutput"
          }

          if ($proc.ExitCode -ne 0) {
            Write-Warning "MetaEditor exited with code $($proc.ExitCode) but output exists and no compile errors were reported."
          }

      # Keep existing EX5 artifact upload for downstream jobs/releases.
      - name: Upload MtApi5.ex5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MtApi5-ex5
          path: mq5/MtApi5.ex5
          if-no-files-found: error

      # Keep existing compile log artifact upload for debugging failed builds.
      - name: Upload compile log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql5-compile-log
          path: ${{ runner.temp }}\metaeditor-compile.log
          if-no-files-found: ignore
